<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="翻开卡片，找出所有相同图案。一个轻松、有趣的记忆力小游戏。"
    />
    <meta name="theme-color" content="#fbf6ec" />
    <title>翻翻乐 · 记忆配对</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./game.js" defer></script>
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main class="game-shell">
      <header class="hero">
        <a class="home-link" href="/" aria-label="返回博客首页">
          <span aria-hidden="true">←</span> 返回博客
        </a>
        <div class="eyebrow">MEMORY GARDEN</div>
        <div class="title-row">
          <div>
            <h1>翻翻乐</h1>
            <p>记住每一次相遇，找出藏在花园里的朋友。</p>
          </div>
          <div class="mascot" aria-hidden="true">✦</div>
        </div>
      </header>

      <section class="control-bar" aria-label="游戏设置和统计">
        <div class="difficulty" role="group" aria-label="选择难度">
          <button class="level-button" type="button" data-level="easy">轻松</button>
          <button class="level-button is-active" type="button" data-level="normal">标准</button>
          <button class="level-button" type="button" data-level="hard">挑战</button>
        </div>

        <div class="stats" aria-live="polite">
          <div class="stat">
            <span class="stat-label">步数</span>
            <strong id="moves">0</strong>
          </div>
          <div class="stat">
            <span class="stat-label">时间</span>
            <strong id="timer">00:00</strong>
          </div>
          <div class="stat">
            <span class="stat-label">最佳</span>
            <strong id="best">—</strong>
          </div>
        </div>

        <button class="reset-button" id="reset-button" type="button">
          <span aria-hidden="true">↻</span> 重新洗牌
        </button>
      </section>

      <section class="game-area" aria-labelledby="game-instruction">
        <div class="progress-row">
          <p id="game-instruction">翻开两张卡片，找到相同的图案</p>
          <p><span id="matched-count">0</span>/<span id="pair-count">8</span> 对</p>
        </div>
        <div class="progress-track" aria-hidden="true">
          <span id="progress-fill"></span>
        </div>

        <div class="game-board" id="game-board" aria-label="记忆翻牌游戏区"></div>
      </section>

      <footer class="game-footer">
        <p><span aria-hidden="true">⌨</span> 可使用 Tab 选择卡片，按 Enter 翻开</p>
        <p>Made for a tiny moment of joy.</p>
      </footer>
    </main>

    <div class="celebration" id="celebration" hidden>
      <div class="celebration-backdrop"></div>
      <section class="result-card" role="dialog" aria-modal="true" aria-labelledby="result-title">
        <div class="result-icon" aria-hidden="true">✦</div>
        <p class="result-kicker">GARDEN COMPLETE</p>
        <h2 id="result-title">全部找到啦！</h2>
        <p id="result-summary">你完成了这局游戏。</p>
        <div class="result-stats">
          <div><strong id="result-moves">0</strong><span>步</span></div>
          <div><strong id="result-time">00:00</strong><span>用时</span></div>
        </div>
        <p class="new-record" id="new-record" hidden>新的最佳成绩 ✦</p>
        <button class="play-again-button" id="play-again-button" type="button">再玩一次</button>
      </section>
    </div>
  </body>
</html>
